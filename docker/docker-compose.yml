services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: family-vpn-wg-easy
    restart: unless-stopped

    environment:
      - WG_HOST=${WG_HOST}
      - PASSWORD=${WG_EASY_PASSWORD}
      - WG_PORT=${WG_PORT}
      - PORT=${WG_EASY_PORT}

    volumes:
      - ../configs/wireguard:/etc/wireguard

    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
      - "${WG_EASY_PORT}:${WG_EASY_PORT}/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1